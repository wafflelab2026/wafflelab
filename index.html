<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Waffle Lab</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"><style>
:root{
  --primary:#c47a3a;
  --bg:#fff3e3;
  --card:#fffaf3;
  --dark:#2b1b10;
  --accent:#8b4a1a;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:linear-gradient(180deg,var(--bg),#fff);color:var(--dark);}

nav{
  position:sticky;top:0;
  background:rgba(255,250,243,0.9);
  backdrop-filter:blur(10px);
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px;
}

.logo{width:45px;height:45px;border-radius:50%;animation:spin 7s linear infinite;border:2px solid var(--primary);}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.hero{text-align:center;padding:60px 20px;}
.btn{background:var(--primary);color:white;border:none;padding:12px 18px;border-radius:30px;cursor:pointer;}

.container{display:flex;gap:20px;max-width:1100px;margin:auto;}
.box{flex:2;background:var(--card);padding:20px;border-radius:16px;}
.tracker{flex:1;background:white;padding:20px;border-radius:16px;}

.step{display:none;}
.step.active{display:block;}
.option{padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:10px;cursor:pointer;}
.option:hover{border-color:var(--primary);}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;}
.modal-content{background:white;padding:20px;border-radius:15px;width:90%;max-width:420px;}

</style></head>
<body><nav>
  <img src="logo.png" class="logo">
  <h1>Waffle Lab</h1>
</nav><section class="hero">
  <h2>Build Your Waffles</h2>
  <button class="btn" onclick="startOrder()">Start Order</button>
</section><section class="container"><div class="box"><!-- STEP 1 --><div class="step active" id="step1">
<h3>Select Amount</h3>
<div class="option" onclick="setAmount(1,'1/4 - £2',2)">1 waffle - £2</div>
<div class="option" onclick="setAmount(2,'2 waffles - £9',9)">2 waffles - £9</div>
<div class="option" onclick="setAmount(5,'5 Family - £20',20)">5 Family - £20</div>
</div><!-- STEP 2 dynamic waffle builder --><div class="step" id="step2">
<h3 id="waffleTitle">Waffle 1</h3>
<div class="option" onclick="set('topping','Kinder')">Kinder</div>
<div class="option" onclick="set('topping','Oreo')">Oreo</div>
<div class="option" onclick="set('topping','Biscoff')">Biscoff</div>
<div class="option" onclick="set('topping','None')">None</div><div class="option" onclick="set('syrup','Milk Choc')">Milk Choc</div>
<div class="option" onclick="set('syrup','White Choc')">White Choc</div>
<div class="option" onclick="set('syrup','Biscoff')">Biscoff</div>
<div class="option" onclick="set('syrup','None')">None</div><button class="btn" onclick="nextWaffle()">Next Waffle</button>

</div><!-- STEP 3 details --><div class="step" id="step3">
<h3>Your Details</h3>
<input id="name" placeholder="Name" style="width:100%;padding:10px;margin:10px 0;">
<input id="phone" placeholder="Phone" style="width:100%;padding:10px;margin:10px 0;">
<button class="btn" onclick="confirm()">Confirm Order</button>
</div></div><div class="tracker">
<h3>Live Order</h3>
<div id="live"></div>
<p><b>Total:</b> £<span id="total">0</span></p>
</div></section><div class="modal" id="modal">
  <div class="modal-content">
    <h3>Confirm Order</h3>
    <div id="summary"></div>
    <button class="btn" onclick="send()">Send</button>
    <button class="btn" onclick="closeM()">Cancel</button>
  </div>
</div><script>
let waffles=[];
let current=0;
let amount=0;
let basePrice=0;

let temp={topping:"",syrup:""};

function startOrder(){
  document.getElementById('step1').classList.add('active');
}

function setAmount(n,label,price){
  amount=n;
  basePrice=price;

  for(let i=0;i<n;i++) waffles.push({topping:"",syrup:""});

  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  updateTitle();
}

function updateTitle(){
  document.getElementById('waffleTitle').innerText="Waffle "+(current+1);
}

function set(type,val){
  waffles[current][type]=val;
  render();
}

function nextWaffle(){
  current++;
  if(current>=amount){
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step3').classList.add('active');
    return;
  }
  updateTitle();
  render();
}

function render(){
  let html="";
  waffles.forEach((w,i)=>{
    html+=`Waffle ${i+1}: ${w.topping||"-"} / ${w.syrup||"-"}<br>`;
  });
  document.getElementById('live').innerHTML=html;
}

function confirm(){
  let summary="";
  waffles.forEach((w,i)=>{
    summary+=`Waffle ${i+1}: ${w.topping}, ${w.syrup}<br>`;
  });
  document.getElementById('summary').innerHTML=summary;
  document.getElementById('modal').style.display='flex';
}

function closeM(){document.getElementById('modal').style.display='none';}

function send(){
  let name=document.getElementById('name').value;
  let phone=document.getElementById('phone').value;

  let msg=`Waffle Order:\nName:${name}\nPhone:${phone}\n`;

  waffles.forEach((w,i)=>{
    msg+=`W${i+1}: ${w.topping}, ${w.syrup}\n`;
  });

  window.open(`https://wa.me/447364135785?text=${encodeURIComponent(msg)}`);
  closeM();
}
</script></body>
</html>
