<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waffle Lab | Order</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="main-nav">
    <a href="index.html">Order</a>
    <a href="menu.html">Menu</a>
    <a href="extras.html">Extras</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="waffle-container">

<div class="step active" id="step1">
    <h1>Waffle Lab Luton</h1>
    <button onclick="nextStep(2)">Start My Order</button>
</div>

<div class="step" id="step2">
    <h3>Choose Size</h3>

    <button onclick="selectSize('1/4',2,this)">1/4 (£2)</button>
    <button onclick="selectSize('Single',5,this)">Single (£5)</button>
    <button onclick="selectSize('2',9,this)">2 (£9)</button>
    <button onclick="selectSize('5',20,this)">5 (£20)</button>

    <button id="next2" onclick="nextStep(3)" disabled>Next</button>
</div>

<div class="step" id="step3">
    <h3>Sauce</h3>
    <button onclick="setSauce('Milk')">Milk</button>
    <button onclick="setSauce('White')">White</button>
    <button onclick="setSauce('Pistachio')">Pistachio</button>
    <button onclick="setSauce('None')">None</button>

    <button onclick="nextStep(4)">Next</button>
</div>

<div class="step" id="step4">
    <h3>Toppings</h3>
    <button onclick="setTopping('Oreo')">Oreo</button>
    <button onclick="setTopping('Kinder')">Kinder</button>
    <button onclick="setTopping('Biscoff')">Biscoff</button>
    <button onclick="setTopping('Marsh')">Marsh</button>

    <button onclick="nextStep(5)">Next</button>
</div>

<div class="step" id="step5">
    <h3>Extras</h3>
    <button onclick="toggleExtra('Extra Sauce')">Extra Sauce</button>
    <button onclick="toggleExtra('Extra Topping')">Extra Topping</button>
    <button onclick="toggleExtra('Cream')">Cream</button>

    <button onclick="nextStep(6)">Finish</button>
</div>

<div class="step" id="step6">
    <h3>Summary</h3>
    <div id="summary"></div>

    <input id="name" placeholder="Name">
    <button onclick="send()">WhatsApp</button>
</div>

</div>

<script>
let size="", price=0, sauce="", topping="", extras=[];

function nextStep(n){
    document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
    document.getElementById('step'+n).classList.add('active');
    if(n===6) show();
}

function selectSize(n,p,btn){
    size=n; price=p;
    document.getElementById('next2').disabled=false;
}

function setSauce(s){ sauce=s; }
function setTopping(t){ topping=t; }

function toggleExtra(e){
    if(extras.includes(e)) extras=extras.filter(x=>x!==e);
    else extras.push(e);
}

function show(){
document.getElementById("summary").innerHTML =
`Size: ${size}<br>Sauce: ${sauce}<br>Topping: ${topping}<br>Extras: ${extras.join(", ")||"None"}`;
}

function send(){
let name=document.getElementById("name").value;

window.open("https://wa.me/447364135785?text=" +
"*ORDER*%0AName: "+name+"%0ASize: "+size);
}
</script>

</body>
</html>
