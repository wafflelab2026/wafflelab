<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Waffle Lab</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"><style>
:root{
  --primary:#c47a3a;
  --bg:#fff3e3;
  --card:#fffaf3;
  --dark:#2b1b10;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:linear-gradient(180deg,var(--bg),#fff);color:var(--dark);}

nav{
  position:sticky;top:0;
  background:rgba(255,250,243,0.9);
  backdrop-filter:blur(10px);
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px;
}

.logo{width:45px;height:45px;border-radius:50%;animation:spin 7s linear infinite;border:2px solid var(--primary);}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.hero{text-align:center;padding:60px 20px;}
.btn{background:var(--primary);color:white;border:none;padding:12px 18px;border-radius:30px;cursor:pointer;}

.container{display:flex;gap:20px;max-width:1100px;margin:auto;}
.box{flex:2;background:var(--card);padding:20px;border-radius:16px;}
.tracker{flex:1;background:white;padding:20px;border-radius:16px;}

.step{display:none;}
.step.active{display:block;}
.option{padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:10px;cursor:pointer;}
.option:hover{border-color:var(--primary);}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;}
.modal-content{background:white;padding:20px;border-radius:15px;width:90%;max-width:420px;}

</style></head>
<body><nav>
  <img src="logo.png" class="logo">
  <h1>Waffle Lab</h1>
</nav><section class="hero">
  <h2>Build Your Waffles</h2>
  <button class="btn" onclick="startOrder()">Start Order</button>
</section><section class="container"><div class="box"><div class="step active" id="step1">
<h3>Select Amount</h3>
<div class="option" onclick="setAmount(1)">1 waffle - £2</div>
<div class="option" onclick="setAmount(2)">2 waffles - £9</div>
<div class="option" onclick="setAmount(5)">5 waffles - £20</div>
</div><div class="step" id="step2">
<h3 id="title">Waffle 1 - Sauce</h3>
<div id="options"></div>
<button class="btn" onclick="nextStep()">Next</button>
</div><div class="step" id="step3">
<h3>Your Details</h3>
<input id="name" placeholder="Name" style="width:100%;padding:10px;margin:10px 0;">
<input id="phone" placeholder="Phone" style="width:100%;padding:10px;margin:10px 0;">
<button class="btn" onclick="confirm()">Confirm</button>
</div></div><div class="tracker">
<h3>Live Order</h3>
<div id="live"></div>
<p><b>Total:</b> £<span id="total">0</span></p>
</div></section><div class="modal" id="modal">
  <div class="modal-content">
    <h3>Confirm Order</h3>
    <div id="summary"></div>
    <button class="btn" onclick="send()">Send</button>
    <button class="btn" onclick="closeM()">Cancel</button>
  </div>
</div><script>
let waffles=[];
let amount=0;
let current=0;
let step=0;

function startOrder(){
  document.getElementById('step1').classList.add('active');
}

function setAmount(n){
  amount=n;
  for(let i=0;i<n;i++) waffles.push({sauce:"",topping:"",extras:[]});
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  renderOptions();
  updateTitle();
}

function updateTitle(){
  const titles=["Sauce","Topping","Extras"];
  document.getElementById('title').innerText=`Waffle ${current+1} - ${titles[step]}`;
}

function renderOptions(){
  let html="";

  if(step===0){
    html+=`<div class='option' onclick="select('sauce','Milk Choc')">Milk Choc</div>
            <div class='option' onclick="select('sauce','White Choc')">White Choc</div>
            <div class='option' onclick="select('sauce','Biscoff')">Biscoff</div>`;
  }

  if(step===1){
    html+=`<div class='option' onclick="select('topping','Oreo')">Oreo</div>
            <div class='option' onclick="select('topping','Kinder')">Kinder</div>
            <div class='option' onclick="select('topping','Biscoff')">Biscoff</div>`;
  }

  if(step===2){
    html+=`<div class='option' onclick="toggle('Extra Oreo')">Extra Oreo</div>
            <div class='option' onclick="toggle('Extra Biscoff')">Extra Biscoff</div>
            <div class='option' onclick="toggle('None')">None</div>`;
  }

  document.getElementById('options').innerHTML=html;
}

function select(type,val){
  waffles[current][type]=val;
  render();
}

function toggle(val){
  if(val==='None') waffles[current].extras=[];
  else {
    let e=waffles[current].extras;
    e.includes(val)?e.splice(e.indexOf(val),1):e.push(val);
  }
  render();
}

function nextStep(){
  step++;

  if(step>2){
    step=0;
    current++;

    if(current>=amount){
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step3').classList.add('active');
      return;
    }
  }

  updateTitle();
  renderOptions();
  render();
}

function render(){
  let html="";
  waffles.forEach((w,i)=>{
    html+=`W${i+1}: ${w.sauce||"-"} / ${w.topping||"-"} / ${w.extras.join(',')||"-"}<br>`;
  });
  document.getElementById('live').innerHTML=html;
}

function confirm(){
  let sum="";
  waffles.forEach((w,i)=>{
    sum+=`Waffle ${i+1}: ${w.sauce}, ${w.topping}, ${w.extras.join(', ')}<br>`;
  });
  document.getElementById('summary').innerHTML=sum;
  document.getElementById('modal').style.display='flex';
}

function closeM(){document.getElementById('modal').style.display='none';}

function send(){
  let name=document.getElementById('name').value;
  let phone=document.getElementById('phone').value;

  let msg=`Waffle Order:\nName:${name}\nPhone:${phone}\n`;

  waffles.forEach((w,i)=>{
    msg+=`W${i+1}: ${w.sauce}, ${w.topping}, ${w.extras.join(', ')}\n`;
  });

  window.open(`https://wa.me/447364135785?text=${encodeURIComponent(msg)}`);
  closeM();
}
</script></body>
</html>
