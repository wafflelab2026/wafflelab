<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waffle Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"><style>
:root{
  --bg:#2b1b10;
  --card:#3a2418;
  --primary:#c47a3a;
  --text:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:var(--bg);color:var(--text);} 

nav{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#3a2418;z-index:1000;}
.logo-wrap{display:flex;align-items:center;gap:12px;}
.logo{width:55px;height:55px;border-radius:50%;border:2px solid var(--primary);animation:spin 10s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.nav-links a{margin-left:15px;color:white;text-decoration:none;cursor:pointer;}

.start{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-top:80px;}
.start h1{font-size:3rem;}
.start button{margin-top:25px;padding:15px 28px;border:none;border-radius:30px;background:var(--primary);cursor:pointer;font-size:1.2rem;}

.main{display:none;padding:100px 20px 20px;max-width:1100px;margin:auto;}
.layout{display:flex;gap:20px;}
.box{flex:2;background:var(--card);padding:20px;border-radius:16px;}
.tracker{flex:1;background:#1f130c;padding:20px;border-radius:16px;position:sticky;top:100px;height:fit-content;}

.option{padding:12px;margin:8px 0;background:#4b2e1e;border-radius:12px;cursor:pointer;}
.option.selected{outline:2px solid var(--primary);} 

.btn{background:var(--primary);border:none;padding:10px 15px;border-radius:20px;margin-top:10px;cursor:pointer;}

.step{display:none;}
.step.active{display:block;}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:2000;}
.modal-content{background:#3a2418;padding:20px;border-radius:15px;width:90%;max-width:400px;}
</style></head>
<body><nav>
  <div class="logo-wrap">
    <img src="logo.png" class="logo">
    <h1>Waffle Lab</h1>
  </div>
  <div class="nav-links">
    <a onclick="goHome()">Home</a>
    <a onclick="startOrder()">Menu</a>
  </div>
</nav><div class="start" id="start">
  <h1>WAFFLE LAB</h1>
  <button onclick="startOrder()">START ORDER</button>
</div><div class="main" id="main">
<div class="layout"><div class="box"><div class="step active" id="step1">
<h3>Choose Size</h3>
<div class="option" onclick="chooseSize(this,'1 waffle',5)">1 waffle - £5</div>
<div class="option" onclick="chooseSize(this,'2 waffles',9)">2 waffles - £9</div>
</div><div class="step" id="step2">
<h3>Choose Sauce</h3>
<div class="option" onclick="chooseSingle(this,'sauce','Milk Chocolate',0.75)">Milk Chocolate</div>
<div class="option" onclick="chooseSingle(this,'sauce','White Chocolate',0.75)">White Chocolate</div>
<button class="btn" onclick="next()">Next</button>
</div><div class="step" id="step3">
<h3>Choose Topping</h3>
<div class="option" onclick="chooseSingle(this,'topping','Oreo',0.5)">Oreo</div>
<div class="option" onclick="chooseSingle(this,'topping','Kinder',0.5)">Kinder</div>
<button class="btn" onclick="next()">Next</button>
</div><div class="step" id="step4">
<h3>Extras</h3>
<div class="option" onclick="toggleExtra(this,'Whipped Cream',0.5)">Whipped Cream</div>
<button class="btn" onclick="openConfirm()">Finish</button>
</div></div><div class="tracker">
<h3>Live Order</h3>
<div id="live"></div>
<p><b>Total:</b> £<span id="total">0</span></p>
</div></div>
</div><!-- CONFIRM MODAL --><div class="modal" id="confirm">
  <div class="modal-content">
    <h3>Confirm Order</h3>
    <div id="summary"></div>
    <button class="btn" onclick="sendOrder()">Send to WhatsApp</button>
    <button class="btn" onclick="closeConfirm()" style="background:#777">Cancel</button>
  </div>
</div><!-- SOUND --><audio id="ding" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
let order={size:"",sauce:"",topping:"",extras:[]};
let total=0;
let prices={sauce:0,topping:0};
let step=1;

function goHome(){location.reload();}
function startOrder(){document.getElementById('start').style.display='none';document.getElementById('main').style.display='block';}
function showStep(n){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById('step'+n).classList.add('active');}
function clearSelected(parent){parent.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));}

function chooseSize(el,name,price){clearSelected(el.parentElement);el.classList.add('selected');order.size=name;total=price;update();showStep(2);} 

function chooseSingle(el,type,val,price){clearSelected(el.parentElement);el.classList.add('selected');total-=prices[type]||0;prices[type]=price;total+=price;order[type]=val;update();}

function toggleExtra(el,name,price){let exists=order.extras.find(e=>e.name===name);if(exists){order.extras=order.extras.filter(e=>e.name!==name);total-=price;el.classList.remove('selected');}else{order.extras.push({name,price});total+=price;el.classList.add('selected');}update();}

function next(){step++;showStep(step);} 

function update(){document.getElementById('live').innerHTML=`Size: ${order.size||'-'}<br>Sauce: ${order.sauce||'-'}<br>Topping: ${order.topping||'-'}<br>Extras: ${order.extras.map(e=>e.name).join(', ')||'-'}`;document.getElementById('total').innerText=total.toFixed(2);} 

function openConfirm(){
  let s=`Size: ${order.size}<br>Sauce: ${order.sauce}<br>Topping: ${order.topping}<br>Extras: ${order.extras.map(e=>e.name).join(', ')||'-'}<br><br>Total: £${total.toFixed(2)}`;
  document.getElementById('summary').innerHTML=s;
  document.getElementById('confirm').style.display='flex';
}

function closeConfirm(){document.getElementById('confirm').style.display='none';}

function sendOrder(){
  document.getElementById('ding').play();

  let msg = "🍫 Waffle Lab Order 🍫\n\n";
  msg += "Size: " + order.size + "\n";
  msg += "Sauce: " + order.sauce + "\n";
  msg += "Topping: " + order.topping + "\n";
  msg += "Extras: " + (order.extras.map(e=>e.name).join(', ')||'-') + "\n";
  msg += "Total: £" + total.toFixed(2);

  let url = "https://wa.me/447364135785?text=" + encodeURIComponent(msg);
  window.open(url, '_blank');
}
</script></body>
</html>
