<!DOCTYPE html>
<html>
<head>
<title>Order</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="main-nav">
<a href="index.html">Order</a>
<a href="menu.html">Menu</a>
<a href="extras.html">Extras</a>
<a href="contact.html">Contact</a>
</nav>

<div class="waffle-container">

<img src="logo.png" class="waffle-icon">

<div class="order-card">

<h1>Start Order</h1>

<h3>Choose Size</h3>

<button class="choice-btn" onclick="selectSize('1/4',2)">1/4 (£2)</button>
<button class="choice-btn" onclick="selectSize('Single',5)">Single (£5)</button>
<button class="choice-btn" onclick="selectSize('2',9)">2 (£9)</button>

<h3>Sauce</h3>

<button class="choice-btn" onclick="order.sauce='Milk'">Milk</button>
<button class="choice-btn" onclick="order.sauce='White'">White</button>

<h3>Topping</h3>

<button class="choice-btn" onclick="order.top='Oreo'">Oreo</button>
<button class="choice-btn" onclick="order.top='Kinder'">Kinder</button>

<button class="btn" onclick="finish()">Finish</button>

<div id="summary"></div>

<input id="name" placeholder="Name">

<button class="btn" onclick="send()">Send WhatsApp</button>

</div>

</div>

<script>
let order={size:"",price:0,sauce:"",top:""};

function selectSize(name,price){
order.size=name;
order.price=price;
}

function finish(){
document.getElementById("summary").innerHTML=
`Size: ${order.size}<br>Sauce: ${order.sauce}<br>Topping: ${order.top}`;
}

function send(){
let name=document.getElementById("name").value;
let msg=`Order from ${name}%0A${JSON.stringify(order)}`;
window.open(`https://wa.me/447364135785?text=${msg}`);
}
</script>

</body>
</html>
