<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Waffle Lab | Order</title>
<link rel="stylesheet" href="style.css">

<style>
.step { display: none; }
.step.active { display: block; animation: fadeIn 0.3s ease-in; }

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.option-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
}

.choice-btn {
    padding: 18px;
    background: #fff8dc;
    border: 2px solid #d2691e;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

.choice-btn.selected {
    background: #d2691e;
    color: white;
}

#liveTotal {
    background: #d2691e;
    color: white;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}

.summary-box {
    background: #fff8dc;
    padding: 15px;
    border-radius: 15px;
}
</style>
</head>

<body>

<div id="liveTotal">Live Total: £0.00</div>

<!-- STEP 1 -->
<div class="step active" id="step1">
    <h1>Waffle Lab Luton</h1>
    <button onclick="nextStep(2)">Start Order</button>
</div>

<!-- STEP 2 -->
<div class="step" id="step2">
<h3>Choose Size</h3>

<div class="option-grid">
<button class="choice-btn" onclick="selectSize('1/4',2,1,this)">1/4 (£2)</button>
<button class="choice-btn" onclick="selectSize('Single',5,1,this)">Single (£5)</button>
<button class="choice-btn" onclick="selectSize('2 Waffles',9,2,this)">2 (£9)</button>
<button class="choice-btn" onclick="selectSize('5 Deal',20,5,this)">5 (£20)</button>
</div>

<button id="next2" disabled onclick="start()">Next</button>
</div>

<!-- STEP 3 -->
<div class="step" id="step3">
<h3>Sauce</h3>

<div class="option-grid">
<button class="choice-btn" onclick="setSauce('Milk')">Milk</button>
<button class="choice-btn" onclick="setSauce('White')">White</button>
<button class="choice-btn" onclick="setSauce('Pistachio')">Pistachio</button>
<button class="choice-btn" onclick="setSauce('None')">None</button>
</div>

<button onclick="nextStep(4)">Next</button>
</div>

<!-- STEP 4 -->
<div class="step" id="step4">
<h3>Toppings</h3>

<div class="option-grid">
<button class="choice-btn" onclick="setTopping('Oreo')">Oreo</button>
<button class="choice-btn" onclick="setTopping('Kinder')">Kinder</button>
<button class="choice-btn" onclick="setTopping('Biscoff')">Biscoff</button>
<button class="choice-btn" onclick="setTopping('Marsh')">Marsh</button>
</div>

<button onclick="nextStep(5)">Next</button>
</div>

<!-- STEP 5 -->
<div class="step" id="step5">
<h3>Extras</h3>

<p>£0.50 each (Extra Sauce £0.75)</p>

<button onclick="toggleExtra('Extra Sauce')">Extra Sauce</button>
<button onclick="toggleExtra('Extra Topping')">Extra Topping</button>
<button onclick="toggleExtra('Cream')">Cream</button>

<br><br>
<button onclick="finish()">Finish</button>
</div>

<!-- STEP 6 -->
<div class="step" id="step6">
<h3>Summary</h3>
<div id="summary" class="summary-box"></div>

<input id="name" placeholder="Name">
<button onclick="send()">WhatsApp</button>
</div>

let sizeName = '';
let waffles = 0;
