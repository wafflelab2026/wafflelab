<script>

let basePrice = 0;
let sizeName = '';
let waffles = 0;

let sauce = '';
let topping = '';
let extras = [];

function nextStep(n){
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step' + n).classList.add('active');
    if(n === 6) showSummary();
}

function selectSize(name, price, count, btn){
    sizeName = name;
    basePrice = price;
    waffles = count;

    document.querySelectorAll('#step2 .choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    document.getElementById('next2').disabled = false;
    updateTotal();
}

function start(){
    nextStep(3);
}

function setSauce(s){
    sauce = s;
    updateTotal();
}

function setTopping(t){
    topping = t;
    updateTotal();
}

function toggleExtra(e){
    if(extras.includes(e)){
        extras = extras.filter(x => x !== e);
    } else {
        extras.push(e);
    }
    updateTotal();
}

function calcTotal(){
    let total = basePrice;

    extras.forEach(e => {
        total += (e === "Extra Sauce") ? 0.75 : 0.50;
    });

    return total;
}

function updateTotal(){
    document.getElementById("liveTotal").innerText =
        "Live Total: £" + calcTotal().toFixed(2);
}

function finish(){
    nextStep(6);
}

function showSummary(){
    document.getElementById("summary").innerHTML =
        `<b>Size:</b> ${sizeName}<br>
        <b>Sauce:</b> ${sauce}<br>
        <b>Topping:</b> ${topping}<br>
        <b>Extras:</b> ${extras.join(", ") || "None"}<br>
        <h3>Total: £${calcTotal().toFixed(2)}</h3>`;
}

function send(){
    let name = document.getElementById("name").value;

    let text =
    "*NEW ORDER*%0A" +
    "Name: " + name + "%0A" +
    "Size: " + sizeName + "%0A" +
    "Total: £" + calcTotal().toFixed(2);

    window.open("https://wa.me/447364135785?text=" + text);
}

</script>
